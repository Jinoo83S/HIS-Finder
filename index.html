<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIS Finder</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="gate">
    <section class="gate-card">
      <div class="brand-mark">HIS</div>
      <h1 id="title">학생 빠른 찾기</h1>
      <p id="status" class="muted" role="status">학교용 웹 앱 주소를 연결하는 중입니다.</p>
      <p><a id="launch" class="button primary" hidden>학생 검색 열기</a></p>
      <button id="language" class="button primary" type="button">English</button>
    </section>
  </main>
  <script src="./web-app-url.js"></script>
  <script>
    const launch = document.getElementById('launch');
    const url = window.HIS_FINDER_WEB_APP_URL || '';
    const ready = /^https:\/\/script\.google\.com\/(?:a\/[^/]+\/)?macros\/s\/[\w-]+\/exec$/.test(url);
    let english = false;
    if (ready) { launch.href = url; launch.hidden = false; }
    function render() {
      document.documentElement.lang = english ? 'en' : 'ko';
      document.getElementById('title').textContent = english ? 'Find a student' : '학생 빠른 찾기';
      document.getElementById('status').textContent = ready
        ? (english ? 'Open the web app with your school account.' : '학교 계정으로 웹 앱을 열어 주세요.')
        : (english ? 'The school web app link has not been set yet.' : '학교용 웹 앱 주소 설정이 아직 완료되지 않았습니다.');
      launch.textContent = english ? 'Open HIS Finder' : '학생 검색 열기';
      document.getElementById('language').textContent = english ? '한국어' : 'English';
    }
    document.getElementById('language').addEventListener('click', () => { english = !english; render(); });
    render();
  </script>
</body>
</html>
